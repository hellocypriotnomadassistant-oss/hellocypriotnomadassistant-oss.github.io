<!DOCTYPE html>
<html lang="en" class="notranslate" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google" content="notranslate">
    <title>Asena Beshiktepeli | 3D Holographic AI Station</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --cyber-blue: #00f0ff;
            --cyber-orange: #ff9f00;
            --cyber-purple: #bd00ff;
            --cyber-neon: #39ff14;
            --bg-deep: #02040a;
        }

        /* 3D PERSPEKTİF AYARI */
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: var(--bg-deep);
            color: #e2e8f0; font-family: 'Fira Code', monospace;
            overflow-x: hidden;
            perspective: 1200px; /* Görseldeki derinlik hissini bu sağlar */
        }

        #cyber-canvas {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1; background: radial-gradient(circle at 50% 80%, #0c1a3d 0%, var(--bg-deep) 100%);
        }

        /* GİRİŞ EKRANI (BOOT) */
        #boot-screen {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #010206; z-index: 10000; display: flex; align-items: center; justify-content: center;
            transition: all 1s cubic-bezier(0.19, 1, 0.22, 1);
        }
        #boot-screen.hide { transform: translateY(-100%); opacity: 0; }

        .boot-btn {
            background: transparent; border: 1px solid var(--cyber-blue); color: var(--cyber-blue);
            padding: 20px 40px; font-family: 'Orbitron'; font-weight: 900; cursor: pointer;
            box-shadow: 0 0 20px rgba(0,240,255,0.2); animation: pulse 2s infinite;
        }
        @keyframes pulse { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; box-shadow: 0 0 40px var(--cyber-blue); } }

        /* ANA İSTASYON KONTEYNERI (EĞİMLİ YAPI) */
        .station-wrapper {
            max-width: 1200px; margin: 0 auto; padding: 100px 20px;
            transform-style: preserve-3d;
            transform: rotateX(8deg); /* Panelleri görseldeki gibi hafif geriye yatırır */
        }

        /* HOLOGRAM PANEL STİLLERİ (GLASSMORPHISM) */
        .holo-panel {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(0, 240, 255, 0.2);
            border-radius: 20px; padding: 30px; margin-bottom: 30px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5), inset 0 0 30px rgba(0,240,255,0.05);
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative; overflow: hidden; cursor: pointer;
        }
        .holo-panel::after {
            content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: linear-gradient(45deg, transparent, rgba(0,240,255,0.05), transparent);
            transform: rotate(45deg); animation: scan 8s infinite linear;
        }
        @keyframes scan { 0% { transform: translate(-50%, -50%) rotate(45deg); } 100% { transform: translate(50%, 50%) rotate(45deg); } }

        .holo-panel:hover {
            transform: translateZ(30px) rotateX(-2deg);
            border-color: var(--cyber-blue);
            box-shadow: 0 40px 80px rgba(0,0,0,0.8), 0 0 30px rgba(0,240,255,0.1);
        }

        /* PANEL BAŞLIKLARI */
        .panel-title {
            font-family: 'Orbitron'; font-size: 1.1rem; color: #fff;
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid rgba(0,240,255,0.2); padding-bottom: 15px; margin-bottom: 20px;
        }

        /* GRID YAPISI */
        .grid-layout {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 25px;
        }

        /* SLIDER & KONTROLLER */
        .slider-box { margin-bottom: 15px; }
        .slider-box label { display: flex; justify-content: space-between; font-size: 0.8rem; color: #94a3b8; margin-bottom: 8px; }
        .slider-box span { color: var(--cyber-blue); font-weight: bold; }
        .cyber-input { width: 100%; accent-color: var(--cyber-blue); background: rgba(0,0,0,0.5); height: 4px; border-radius: 2px; outline: none; }

        /* MODAL (FULL SCREEN DETAIL) */
        .cyber-modal {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(1, 3, 9, 0.95); backdrop-filter: blur(30px);
            z-index: 20000; display: none; align-items: center; justify-content: center;
            animation: fadeIn 0.4s ease;
        }
        .modal-body {
            width: 85%; max-width: 1000px; background: rgba(10, 18, 38, 0.8);
            border: 1px solid var(--cyber-blue); border-radius: 24px; padding: 40px;
            position: relative; box-shadow: 0 0 100px rgba(0,240,255,0.2);
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* HOLOGRAFİK ZEMİN YANSIMASI (GÖRSELDEKİ PROJEKSİYON TABANI) */
        .projector-base {
            position: fixed; bottom: -50px; left: 50%; transform: translateX(-50%);
            width: 600px; height: 150px; background: radial-gradient(ellipse at center, rgba(0, 240, 255, 0.15) 0%, transparent 70%);
            filter: blur(20px); z-index: 0; pointer-events: none;
        }

        /* SOSYAL BUTONLAR */
        .btn-row { display: flex; justify-content: center; gap: 15px; margin-top: 30px; }
        .btn-cyber {
            padding: 12px 25px; border: 1px solid var(--cyber-blue); background: transparent;
            color: var(--cyber-blue); text-decoration: none; font-size: 0.8rem; font-weight: bold;
            border-radius: 8px; transition: 0.3s;
        }
        .btn-cyber:hover { background: var(--cyber-blue); color: #000; box-shadow: 0 0 20px var(--cyber-blue); }

        .telemetry-log {
            background: rgba(0,0,0,0.5); border-radius: 10px; padding: 15px;
            font-size: 0.75rem; color: var(--cyber-neon); height: 150px; overflow-y: auto;
            border-left: 2px solid var(--cyber-neon); margin-top: 20px;
        }
    </style>
</head>
<body>

    <div id="boot-screen">
        <button class="boot-btn" onclick="initStation()">INITIALIZE NEURAL LINK</button>
    </div>

    <div class="projector-base"></div>

    <canvas id="cyber-canvas"></canvas>

    <div class="station-wrapper notranslate">
        
        <div class="holo-panel" onclick="showDetail('Core Identity', 'Neural synchronization successful. System admin: Asena. Accessing multi-dimensional data engineering nodes.')">
            <div class="panel-title">
                <span>SYSTEM OPERATOR</span>
                <span style="color: var(--cyber-neon); font-size: 0.7rem;">● ONLINE</span>
            </div>
            <div style="display: flex; align-items: center; gap: 30px;">
                <img src="https://github.com/hellocypriotnomadassistant-oss.png" style="width: 110px; border-radius: 50%; border: 2px solid var(--cyber-blue); box-shadow: 0 0 20px rgba(0,240,255,0.3);">
                <div>
                    <h1 style="margin: 0; font-size: 2.2rem;">Asena Beshiktepeli</h1>
                    <p style="color: var(--cyber-purple); margin: 5px 0; letter-spacing: 2px;">AI & DATA ENGINEER</p>
                    <div class="btn-row" style="justify-content: flex-start; margin-top: 15px;">
                        <a href="https://www.linkedin.com/in/cypriotasena" target="_blank" class="btn-cyber">LINKEDIN</a>
                        <a href="https://www.kaggle.com/anesaa" target="_blank" class="btn-cyber" style="border-color: var(--cyber-orange); color: var(--cyber-orange);">KAGGLE</a>
                    </div>
                </div>
            </div>
        </div>

        <div class="grid-layout">
            <div class="holo-panel" onclick="showDetail('Waze Churn Engine', 'Processing historical device telemetry. Gradient Boosting algorithm evaluates churn probability based on spatial distance and engagement metrics.')">
                <div class="panel-title"><span>WAZE ANALYTICS</span> <small style="color: var(--cyber-blue)">GBM NODE</small></div>
                <div class="slider-box" onclick="event.stopPropagation()">
                    <label>Driving Distance: <span id="km-val">3500 km</span></label>
                    <input type="range" min="500" max="8000" value="3500" class="cyber-input" id="km-input">
                </div>
                <div class="slider-box" onclick="event.stopPropagation()">
                    <label>Sessions: <span id="s-val">25</span></label>
                    <input type="range" min="1" max="100" value="25" class="cyber-input" id="s-input">
                </div>
                <div id="waze-status" style="color: var(--cyber-neon); font-size: 0.8rem; font-weight: bold; margin-top: 10px;">ANALYZING...</div>
            </div>

            <div class="holo-panel" onclick="showDetail('TikTok Audit Hub', 'Random Forest architecture scanning unstructured media arrays. Generating integrity scores for automated content moderation.')">
                <div class="panel-title"><span>TIKTOK AUDIT</span> <small style="color: var(--cyber-orange)">RF NODE</small></div>
                <div class="slider-box" onclick="event.stopPropagation()">
                    <label>Video Views: <span id="v-val">45,000</span></label>
                    <input type="range" min="1000" max="500000" value="45000" class="cyber-input" id="v-input" style="accent-color: var(--cyber-orange);">
                </div>
                <div class="slider-box" onclick="event.stopPropagation()">
                    <label>Report Count: <span id="r-val">12</span></label>
                    <input type="range" min="0" max="100" value="12" class="cyber-input" id="r-input" style="accent-color: var(--cyber-orange);">
                </div>
                <div id="tiktok-status" style="color: var(--cyber-orange); font-size: 0.8rem; font-weight: bold; margin-top: 10px;">SCANNING...</div>
            </div>

            <div class="holo-panel" onclick="showDetail('Tech Stack Node', 'Compiling production-ready code modules. Optimized for high-velocity data pipelines and distributed cloud environments.')">
                <div class="panel-title"><span>TECH MATRIX</span></div>
                <div style="display: flex; flex-wrap: wrap; gap: 8px;">
                    <span style="background: rgba(0,0,0,0.4); border: 1px solid var(--cyber-blue); padding: 5px 12px; border-radius: 5px; font-size: 0.7rem;">Python (OOP)</span>
                    <span style="background: rgba(0,0,0,0.4); border: 1px solid var(--cyber-orange); padding: 5px 12px; border-radius: 5px; font-size: 0.7rem;">SQL Master</span>
                    <span style="background: rgba(0,0,0,0.4); border: 1px solid var(--cyber-purple); padding: 5px 12px; border-radius: 5px; font-size: 0.7rem;">Scikit-Learn</span>
                </div>
                <div style="height: 150px; margin-top: 20px;">
                    <canvas id="radarChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <div id="detailModal" class="cyber-modal">
        <div class="modal-body">
            <span style="position: absolute; top: 20px; right: 30px; font-size: 2rem; color: var(--cyber-blue); cursor: pointer;" onclick="closeModal()">&times;</span>
            <h2 id="modalTitle" style="font-family: 'Orbitron'; color: #fff;">SYSTEM ACCESS</h2>
            <p id="modalDesc" style="color: #94a3b8; line-height: 1.6;"></p>
            <div class="telemetry-log" id="logStream"></div>
        </div>
    </div>

    <script>
        let audioCtx = null;
        function playSound(f, d, t='sine') {
            try {
                if(!audioCtx) audioCtx = new(window.AudioContext || window.webkitAudioContext)();
                if(audioCtx.state === 'suspended') audioCtx.resume();
                let o = audioCtx.createOscillator(), g = audioCtx.createGain();
                o.type = t; o.frequency.setValueAtTime(f, audioCtx.currentTime);
                g.gain.setValueAtTime(0.1, audioCtx.currentTime);
                g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + d);
                o.connect(g); g.connect(audioCtx.destination);
                o.start(); o.stop(audioCtx.currentTime + d);
            } catch(e){}
        }

        function initStation() {
            playSound(100, 1, 'sawtooth');
            setTimeout(() => playSound(500, 0.5), 200);
            document.getElementById('boot-screen').classList.add('hide');
        }

        function showDetail(title, desc) {
            playSound(600, 0.2);
            document.getElementById('modalTitle').innerText = "// " + title.toUpperCase();
            document.getElementById('modalDesc').innerText = desc;
            document.getElementById('detailModal').style.display = 'flex';
            
            const log = document.getElementById('logStream');
            log.innerHTML = '';
            let lines = ["Loading modules...", "Establishing neural handshake...", "Data packets synchronized.", "Accessing core telemetry..."];
            lines.forEach((l, i) => {
                setTimeout(() => {
                    log.innerHTML += "> " + l + "<br>";
                    playSound(800 + (i*100), 0.05);
                }, i * 200);
            });
        }

        function closeModal() {
            playSound(200, 0.2);
            document.getElementById('detailModal').style.display = 'none';
        }

        // ARKA PLAN PARÇACIK MOTORU
        const canvas = document.getElementById('cyber-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize); resize();

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = canvas.height + 10;
                this.speed = Math.random() * 2 + 0.5;
                this.len = Math.random() * 50 + 10;
                this.op = Math.random() * 0.3;
            }
            update() {
                this.y -= this.speed;
                if(this.y < -50) this.y = canvas.height + 50;
            }
            draw() {
                ctx.strokeStyle = `rgba(0, 240, 255, ${this.op})`;
                ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(this.x, this.y);
                ctx.lineTo(this.x, this.y - this.len); ctx.stroke();
            }
        }
        for(let i=0; i<50; i++) particles.push(new Particle());
        function anim() {
            ctx.fillStyle = 'rgba(2, 4, 10, 0.2)'; ctx.fillRect(0,0,canvas.width,canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(anim);
        }
        anim();

        // SIMULATORS LOGIC
        const kmI = document.getElementById('km-input'), sI = document.getElementById('s-input');
        const vI = document.getElementById('v-input'), rI = document.getElementById('r-input');

        function updateWaze() {
            const v = parseInt(kmI.value); const s = parseInt(sI.value);
            document.getElementById('km-val').innerText = v + " km"; document.getElementById('s-val').innerText = s;
            let score = Math.round((v/8000)*60 + (100-s)*0.4);
            document.getElementById('waze-status').innerText = score > 60 ? "⚠️ CRITICAL CHURN: " + score + "%" : "✅ STABLE: " + score + "%";
        }
        function updateTikTok() {
            const v = parseInt(vI.value); const r = parseInt(rI.value);
            document.getElementById('v-val').innerText = v.toLocaleString(); document.getElementById('r-val').innerText = r;
            let score = Math.round((r*0.8) + (v/500000)*20);
            document.getElementById('tiktok-status').innerText = score > 50 ? "🚨 ALERT: RISK " + score + "%" : "🟢 CLEAN: RISK " + score + "%";
        }
        kmI.oninput = () => { updateWaze(); playSound(400, 0.01); };
        sI.oninput = () => { updateWaze(); playSound(420, 0.01); };
        vI.oninput = () => { updateTikTok(); playSound(440, 0.01); };
        rI.oninput = () => { updateTikTok(); playSound(460, 0.01); };
        updateWaze(); updateTikTok();

        // RADAR CHART
        const rCtx = document.getElementById('radarChart').getContext('2d');
        new Chart(rCtx, {
            type: 'radar',
            data: {
                labels: ['ML', 'Data Eng', 'SQL', 'Python', 'Stats'],
                datasets: [{
                    label: 'Capability',
                    data: [90, 85, 95, 88, 82],
                    borderColor: '#00f0ff', backgroundColor: 'rgba(0, 240, 255, 0.1)',
                    pointBackgroundColor: '#bd00ff'
                }]
            },
            options: {
                responsive: true, maintainAspectRatio: false,
                scales: { r: { grid: { color: 'rgba(255,255,255,0.05)' }, angleLines: { color: 'rgba(255,255,255,0.05)' }, pointLabels: { color: '#94a3b8' }, ticks: { display: false } } },
                plugins: { legend: { display: false } }
            }
        });
    </script>

    <script type="text/javascript">
        (function(d, t) {
            var v = d.createElement(t), s = d.getElementsByTagName(t)[0];
            v.onload = function() {
                window.voiceflow.chat.load({
                    verify: { projectID: '6a1b26696b0f6697163e7922' },
                    url: 'https://general-runtime.voiceflow.com',
                    versionID: 'production'
                });
            };
            v.src = "https://cdn.voiceflow.com/widget-next/bundle.mjs"; v.type = "text/javascript";
            s.parentNode.insertBefore(v, s);
        })(document, 'script');
    </script>
</body>
</html>
