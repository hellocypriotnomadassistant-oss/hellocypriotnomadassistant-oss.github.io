<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asena Beshiktepeli | Data Scientist Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Orbitron:wght@500;700;900&family=Segoe+UI:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        /* Fade-in Sayfa Giriş Animasyonu */
        @keyframes fadeInScene {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Canlı Sistem İndikatörü Yanıp Sönme Animasyonu */
        @keyframes pulseGlow {
            0% { transform: scale(0.9); opacity: 0.6; box-shadow: 0 0 0 0 rgba(57, 255, 20, 0.7); }
            50% { transform: scale(1.1); opacity: 1; box-shadow: 0 0 12px 4px rgba(57, 255, 20, 0.5); }
            100% { transform: scale(0.9); opacity: 0.6; box-shadow: 0 0 0 0 rgba(57, 255, 20, 0.0); }
        }

        /* Neon Çizgi Akış Animasyonu */
        @keyframes lineFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Genel Kurumsal Siber Arayüz ve Kılavuz Çizgisi Dokusu */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            /* Ana arka plan görseli üzerine siber mühendislik kılavuz çizgileri (grid) dokusu eklendi */
            background: linear-gradient(rgba(6, 9, 19, 0.92), rgba(6, 9, 19, 0.92)),
                        linear-gradient(rgba(0, 240, 255, 0.03) 1px, transparent 1px
